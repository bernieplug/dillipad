<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dilli Pad - The Delhi Street Crossing Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none; /* Prevents pull-to-refresh on mobile */
        }
        h1 {
            margin: 10px 0;
            color: #ff9933; /* Saffron */
            text-shadow: 2px 2px #000;
            font-size: 28px;
            text-align: center;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 4px solid #138808; /* India Green */
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
            max-width: 550px;
        }
        canvas {
            display: block;
            background-color: #333;
            width: 100%;
            height: auto;
            aspect-ratio: 55 / 65; /* Matches the 550x650 resolution */
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        .btn {
            background: #ff9933;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:hover {
            background: #fff;
        }
        .btn:active {
            transform: translateY(2px);
        }
        #difficulty-selector {
            display: flex;
            gap: 15px;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid #ff9933;
            margin-bottom: 15px;
            margin-top: 10px;
        }
        #difficulty-selector label {
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
        }
        #difficulty-selector input[type="radio"] {
            accent-color: #138808;
            transform: scale(1.2);
            cursor: pointer;
        }
        #stats {
            width: 90%;
            max-width: 550px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 16px;
            font-weight: bold;
        }
        .subtitle {
            font-size: 14px;
            color: #aaa;
            text-align: center;
            margin-bottom: 10px;
            padding: 0 10px;
        }
        #footer {
            margin-top: 15px;
            color: #888;
            font-size: 14px;
            letter-spacing: 1px;
            text-align: center;
        }
        @media (max-width: 600px) {
            #stats { font-size: 14px; }
            h1 { font-size: 24px; }
            #difficulty-selector { flex-direction: column; gap: 10px; padding: 15px 30px; }
        }
    </style>
</head>
<body>

    <h1>DILLI PAD 🛺</h1>
    <div id="stats">
        <span id="score-display">Score: 0</span>
        <span id="level-display">Level: 1</span>
        <span id="lives-display">Lives: ❤️❤️❤️</span>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="550" height="650"></canvas>
        <div id="ui-layer">
            <h2 id="ui-title" style="font-size: 36px; color: #ff9933; margin:0; text-align: center;">DILLI PAD</h2>
            <p class="subtitle">Survive the chaos. Get to the apartment.<br>Arrow Keys or <b>Swipe</b> to move.</p>
            <p id="ui-msg" style="font-size: 20px; color: #fff; text-align: center;"></p>
            
            <div id="difficulty-selector">
                <label><input type="radio" name="difficulty" value="0.6" checked> Easy</label>
                <label><input type="radio" name="difficulty" value="1.0"> Medium</label>
                <label><input type="radio" name="difficulty" value="1.5"> Hard</label>
            </div>

            <button id="start-btn" class="btn">Start Crossing</button>
        </div>
    </div>
    
    <div id="footer">Created by Bernie Thompson</div>

<script>
    /** --- AUDIO ENGINE (Web Audio API) --- */
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playTone(freq, type, duration, vol=0.1) {
        if (!audioCtx || audioCtx.state === 'suspended') return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function playHop() { playTone(300, 'sine', 0.1, 0.2); }
    function playSplat() { 
        playTone(100, 'sawtooth', 0.5, 0.3); 
        setTimeout(() => playTone(50, 'square', 0.5, 0.3), 100);
    }
    function playScore() { 
        playTone(600, 'sine', 0.1, 0.2); 
        setTimeout(() => playTone(800, 'sine', 0.2, 0.2), 100);
    }
    function playLevelUp() {
        [400, 500, 600, 800, 1000].forEach((f, i) => {
            setTimeout(() => playTone(f, 'square', 0.1, 0.1), i * 100);
        });
    }

    function playMelodicHorn() {
        if (!audioCtx || Math.random() > 0.02) return;
        const notes = [330, 330, 392, 330, 261, 293];
        notes.forEach((f, i) => {
            setTimeout(() => playTone(f, 'square', 0.15, 0.05), i * 150);
        });
    }

    function playScooterBeep() {
        if (!audioCtx || Math.random() > 0.05) return;
        playTone(750, 'sawtooth', 0.1, 0.05);
        setTimeout(() => playTone(750, 'sawtooth', 0.1, 0.05), 150);
    }

    /** --- GAME LOGIC --- */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const gridSize = 50;
    const rows = 13;
    const cols = 11;
    
    let score = 0;
    let level = 1;
    let lives = 3;
    let isGameOver = false;
    let isPlaying = false;
    let animationId = null;
    let baseSpeedMultiplier = 0.6; // Gets overridden by difficulty selector
    
    let player = {};
    let lanes = [];
    let pads = [];

    const EMOJIS = {
        player: '🚶',
        splat: '💥',
        cow: '🐄',
        vendor: '🛒',
        scooter: '🛵',
        auto: '🛺',
        car: '🚕',
        bus: '🚌',
        truck: '🚚',
        pad: '🏢',
        padFilled: '🏠'
    };

    function resetPlayer() {
        player = {
            x: Math.floor(cols / 2) * gridSize,
            y: (rows - 1) * gridSize,
            width: gridSize,
            height: gridSize,
            isDead: false,
            deadTimer: 0
        };
    }

    function initPads() {
        pads = [];
        for (let i = 0; i < 5; i++) {
            pads.push({
                x: i * (gridSize * 2) + gridSize,
                y: 0,
                width: gridSize,
                height: gridSize,
                isFilled: false
            });
        }
    }

    class Obstacle {
        constructor(x, y, type, speed, direction, length) {
            this.x = x;
            this.y = y;
            this.type = type;
            this.speed = speed;
            this.direction = direction;
            this.width = gridSize * length;
            this.height = gridSize;
            this.emoji = EMOJIS[type];
        }

        update() {
            this.x += this.speed * this.direction;
            if (this.direction === 1 && this.x > canvas.width + this.width) {
                this.x = -this.width;
            } else if (this.direction === -1 && this.x < -this.width * 2) {
                this.x = canvas.width + this.width;
            }
        }

        draw() {
            ctx.font = '35px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const numEmojis = this.width / gridSize;
            for(let i=0; i<numEmojis; i++) {
                ctx.fillText(this.emoji, this.x + (i * gridSize) + gridSize/2, this.y + gridSize/2 + 5);
            }
        }
    }

    function buildLevel() {
        lanes = [];
        const speedMult = baseSpeedMultiplier + (level * 0.15); 

        lanes.push(new Obstacle(100, 11*gridSize, 'vendor', 1 * speedMult, -1, 1));
        lanes.push(new Obstacle(400, 11*gridSize, 'vendor', 1 * speedMult, -1, 1));

        lanes.push(new Obstacle(0, 10*gridSize, 'scooter', 3 * speedMult, 1, 1));
        lanes.push(new Obstacle(250, 10*gridSize, 'scooter', 3 * speedMult, 1, 1));
        lanes.push(new Obstacle(450, 10*gridSize, 'scooter', 3 * speedMult, 1, 1));

        lanes.push(new Obstacle(50, 9*gridSize, 'auto', 2.5 * speedMult, -1, 1));
        lanes.push(new Obstacle(300, 9*gridSize, 'auto', 2.5 * speedMult, -1, 1));

        lanes.push(new Obstacle(100, 8*gridSize, 'car', 3.5 * speedMult, 1, 1));
        lanes.push(new Obstacle(350, 8*gridSize, 'car', 3.5 * speedMult, 1, 1));

        lanes.push(new Obstacle(150, 6*gridSize, 'truck', 1.5 * speedMult, -1, 2));
        lanes.push(new Obstacle(450, 6*gridSize, 'truck', 1.5 * speedMult, -1, 2));

        lanes.push(new Obstacle(0, 5*gridSize, 'bus', 2 * speedMult, 1, 2));
        lanes.push(new Obstacle(350, 5*gridSize, 'bus', 2 * speedMult, 1, 2));

        lanes.push(new Obstacle(100, 4*gridSize, 'auto', 4 * speedMult, -1, 1));
        lanes.push(new Obstacle(400, 4*gridSize, 'auto', 4 * speedMult, -1, 1));

        lanes.push(new Obstacle(50, 3*gridSize, 'scooter', 5 * speedMult, 1, 1));
        lanes.push(new Obstacle(300, 3*gridSize, 'scooter', 5 * speedMult, 1, 1));

        lanes.push(new Obstacle(200, 2*gridSize, 'truck', 2.5 * speedMult, -1, 3));

        lanes.push(new Obstacle(50, 1*gridSize, 'car', 6 * speedMult, 1, 1));
        lanes.push(new Obstacle(150, 1*gridSize, 'car', 6 * speedMult, 1, 1));
    }

    function checkCollisions() {
        if (player.isDead) return;

        const hitboxShrink = 10;
        for (let obs of lanes) {
            if (player.x < obs.x + obs.width - hitboxShrink &&
                player.x + player.width - hitboxShrink > obs.x &&
                player.y < obs.y + obs.height - hitboxShrink &&
                player.y + player.height - hitboxShrink > obs.y) {
                die();
                return;
            }
        }

        if (player.y === 0) {
            let onPad = false;
            for (let pad of pads) {
                if (player.x === pad.x) {
                    onPad = true;
                    if (!pad.isFilled) {
                        pad.isFilled = true;
                        score += 50 * level;
                        playScore();
                        updateUI();
                        checkLevelComplete();
                    } else {
                        die(); 
                        return;
                    }
                    break;
                }
            }
            if (!onPad) {
                die();
            }
        }
    }

    function die() {
        player.isDead = true;
        player.deadTimer = 60;
        lives--;
        playSplat();
        updateUI();

        if (lives <= 0) {
            setTimeout(gameOver, 1000);
        } else {
            setTimeout(resetPlayer, 1000);
        }
    }

    function checkLevelComplete() {
        if (pads.every(p => p.isFilled)) {
            level++;
            score += 1000;
            playLevelUp();
            updateUI();
            isPlaying = false;
            
            setTimeout(() => {
                initPads();
                buildLevel();
                resetPlayer();
                isPlaying = true;
            }, 1500);
        } else {
            resetPlayer();
        }
    }

    function gameOver() {
        isPlaying = false;
        isGameOver = true;
        document.getElementById('ui-layer').classList.remove('hidden');
        document.getElementById('ui-title').innerText = "GAME OVER";
        document.getElementById('ui-title').style.color = "#ff3333";
        document.getElementById('ui-msg').innerText = `Final Score: ${score}`;
        document.getElementById('start-btn').innerText = "Try Again";
    }

    function updateUI() {
        document.getElementById('score-display').innerText = `Score: ${score}`;
        document.getElementById('level-display').innerText = `Level: ${level}`;
        document.getElementById('lives-display').innerText = `Lives: ${'❤️'.repeat(lives)}`;
    }

    /** --- DRAWING --- */
    function drawBackground() {
        ctx.fillStyle = '#4CAF50'; 
        ctx.fillRect(0, 12 * gridSize, canvas.width, gridSize);
        ctx.fillRect(0, 0, canvas.width, gridSize);
        
        ctx.fillStyle = '#8bc34a';
        ctx.fillRect(0, 7 * gridSize, canvas.width, gridSize);
        ctx.font = '30px Arial';
        ctx.fillText(EMOJIS.cow, 100, 7 * gridSize + gridSize/2 + 5);
        ctx.fillText(EMOJIS.cow, 400, 7 * gridSize + gridSize/2 + 5);

        ctx.fillStyle = '#333';
        ctx.fillRect(0, 8 * gridSize, canvas.width, 4 * gridSize);
        ctx.fillRect(0, 1 * gridSize, canvas.width, 6 * gridSize);

        ctx.strokeStyle = '#fff';
        ctx.setLineDash([15, 15]);
        ctx.lineWidth = 2;
        for (let i = 1; i < 12; i++) {
            if (i !== 7 && i !== 12) {
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
        }
        ctx.setLineDash([]);
        
        ctx.strokeStyle = '#ffeb3b';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, 10 * gridSize); ctx.lineTo(canvas.width, 10 * gridSize);
        ctx.moveTo(0, 4 * gridSize); ctx.lineTo(canvas.width, 4 * gridSize);
        ctx.stroke();

        for (let pad of pads) {
            ctx.fillStyle = '#222';
            ctx.fillRect(pad.x, pad.y, pad.width, pad.height);
            ctx.font = '35px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(pad.isFilled ? EMOJIS.padFilled : EMOJIS.pad, pad.x + gridSize/2, pad.y + gridSize/2 + 5);
        }
    }

    function drawPlayer() {
        ctx.font = '35px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const emoji = player.isDead ? EMOJIS.splat : EMOJIS.player;
        ctx.fillText(emoji, player.x + gridSize/2, player.y + gridSize/2 + 5);
    }

    /** --- MAIN LOOP --- */
    function gameLoop() {
        if (!isPlaying) {
            if (!isGameOver) {
                animationId = requestAnimationFrame(gameLoop);
            }
            return;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();

        for (let obs of lanes) {
            obs.update();
            obs.draw();
        }

        drawPlayer();
        checkCollisions();

        playMelodicHorn();
        playScooterBeep();

        animationId = requestAnimationFrame(gameLoop);
    }

    /** --- KEYBOARD INPUT --- */
    window.addEventListener('keydown', (e) => {
        if (!isPlaying || player.isDead) return;

        let moved = false;
        switch(e.key) {
            case 'ArrowUp':
                if (player.y > 0) { player.y -= gridSize; moved = true; score += 1; }
                break;
            case 'ArrowDown':
                if (player.y < (rows - 1) * gridSize) { player.y += gridSize; moved = true; }
                break;
            case 'ArrowLeft':
                if (player.x > 0) { player.x -= gridSize; moved = true; }
                break;
            case 'ArrowRight':
                if (player.x < canvas.width - gridSize) { player.x += gridSize; moved = true; }
                break;
        }
        
        if (moved) {
            playHop();
            e.preventDefault();
            updateUI();
        }
    });

    /** --- MOBILE SWIPE INPUT --- */
    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener('touchstart', function(e) {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
        // Prevent default only if we are actively playing to stop scrolling
        if (isPlaying && !player.isDead) e.preventDefault(); 
    }, {passive: false});

    canvas.addEventListener('touchmove', function(e) {
        if (isPlaying && !player.isDead) e.preventDefault(); 
    }, {passive: false});

    canvas.addEventListener('touchend', function(e) {
        if (!isPlaying || player.isDead) return;

        let touchEndX = e.changedTouches[0].screenX;
        let touchEndY = e.changedTouches[0].screenY;
        
        handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
    }, {passive: false});

    function handleSwipe(startX, startY, endX, endY) {
        let diffX = endX - startX;
        let diffY = endY - startY;
        let moved = false;

        // Require a minimum swipe distance to prevent accidental micro-touches
        if (Math.abs(diffX) < 30 && Math.abs(diffY) < 30) return;

        if (Math.abs(diffX) > Math.abs(diffY)) {
            // Horizontal swipe
            if (diffX > 0) {
                // Right
                if (player.x < canvas.width - gridSize) { player.x += gridSize; moved = true; }
            } else {
                // Left
                if (player.x > 0) { player.x -= gridSize; moved = true; }
            }
        } else {
            // Vertical swipe
            if (diffY > 0) {
                // Down
                if (player.y < (rows - 1) * gridSize) { player.y += gridSize; moved = true; }
            } else {
                // Up
                if (player.y > 0) { player.y -= gridSize; moved = true; score += 1; }
            }
        }

        if (moved) {
            playHop();
            updateUI();
        }
    }

    /** --- START --- */
    document.getElementById('start-btn').addEventListener('click', () => {
        initAudio(); 
        
        // Ensure AudioContext is resumed if it was suspended (browser policy)
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        // Get selected difficulty
        const diffRadios = document.getElementsByName('difficulty');
        for (let radio of diffRadios) {
            if (radio.checked) {
                baseSpeedMultiplier = parseFloat(radio.value);
                break;
            }
        }
        
        score = 0;
        level = 1;
        lives = 3;
        isGameOver = false;
        
        updateUI();
        initPads();
        resetPlayer();
        buildLevel();
        
        document.getElementById('ui-layer').classList.add('hidden');
        isPlaying = true;
        
        if (animationId) {
            cancelAnimationFrame(animationId);
        }
        gameLoop();
    });

</script>
</body>
</html>
